[project]
name = "belcy-eval"
version = "0.2.0"
description = "BELief ConsistencY Evaluation of LLMs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gregor Betz" }]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0.0",
    "inspect-ai>=0.3.242",
    "networkx>=3.4",
    "numpy>=2.0",
    "openai>=2.40.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pyganak>=2.6",
    "pyyaml>=6.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/belcy_eval"]

[tool.ruff]
line-length = 100


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
